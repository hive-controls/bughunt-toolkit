[project]
name = "bughunt"
dynamic = ["version"]
description = "Authorized HTTP attack-surface mapper and toolkit shell"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY-NOTICES.md"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "rich>=13.7.0",
    "httpx==0.28.1",
    "httpcore==1.0.9",
    "tzdata==2026.3",
]

[project.urls]
Homepage = "https://github.com/hive-controls/bughunt-toolkit"
Repository = "https://github.com/hive-controls/bughunt-toolkit"
Issues = "https://github.com/hive-controls/bughunt-toolkit/issues"

[project.optional-dependencies]
screenshots = ["playwright>=1.45.0"]
tor = ["socksio==1.0.0"]
pipeline-yaml = ["PyYAML==6.0.3"]

[project.scripts]
bughunt = "bughunt.console.cli:entry"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bughunt", "bughunt.core", "bughunt.console", "bughunt.integrations", "bughunt.labs", "bughunt.modules"]

[tool.setuptools.package-data]
"bughunt.integrations" = ["browser_consumer.cjs"]

[tool.setuptools.dynamic]
version = {attr = "bughunt.VERSION"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
required-version = "==0.17.1"
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.format]
line-ending = "lf"
